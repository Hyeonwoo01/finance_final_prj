# 초안: 서비스 구성 방식(FastAPI + 프론트 분리) 확정 후 채웁니다.
# backend/frontend Dockerfile이 아직 없어서 db만 실행됩니다.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # backend:
  #   build: ./backend
  #   restart: unless-stopped
  #   env_file: .env
  #   depends_on: [db]
  #   ports:
  #     - "8000:8000"

  # frontend:
  #   build: ./frontend
  #   restart: unless-stopped
  #   depends_on: [backend]
  #   ports:
  #     - "80:80"

volumes:
  db_data:
