# Stock Canary 실행 구성 (docs/tech_spec.md 9-3 기준)
# - 기본 실행(docker compose up -d): db만 시작
# - 서비스 실행(docker compose --profile app up -d): backend, frontend 추가. 각 폴더에 Dockerfile 작성 후 사용
# - 배치 실행(docker compose run --rm pipeline): 수집·정제·추론·임베딩. EC2에서는 cron이 호출
# - 외부 개방 포트는 frontend의 80 하나. 나머지는 Compose 내부망에서 서비스 이름으로 접속 (예: db:5432)
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:  # API 키가 db 컨테이너에 전달되지 않도록 DB 변수만 지정
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"  # 로컬 개발용(이 PC에서만 접속). EC2에서는 제거
    volumes:
      - db_data:/var/lib/postgresql/data
      # 볼륨이 비어 있는 첫 실행 때만 스키마 적용. Alembic 도입 후 제거
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:  # FastAPI
    build: ./backend
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:  # nginx: React 빌드 결과 제공, /api 요청을 backend:8000으로 전달
    build: ./frontend
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  pipeline:  # 배치: pipeline/ + ml/ (모델 추론 포함)
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    profiles: ["batch"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ml/models:/app/ml/models:ro  # 로컬에서 학습한 모델 파일 (git 미포함)

volumes:
  db_data:
